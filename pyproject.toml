[project]
name = "conditionwatch-backend"
version = "0.1.0"
description = "Multi-user ConditionWatch API, OpenAI vision pipeline, and Firebase alert delivery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "email-validator>=2.2,<3",
  "openai>=1.93,<3",
  "firebase-admin>=6.9,<8",
  "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]
