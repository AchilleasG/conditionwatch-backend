<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · ConditionWatch</title>
  <style>
    :root{color-scheme:dark;--bg:#050617;--card:#101126;--text:#f5f2ff;--muted:#a5a8c4;--violet:#8b5cff;--cyan:#20ddf5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#24144f 0,var(--bg) 48%);font:16px system-ui,sans-serif;color:var(--text);padding:24px}
    main{width:min(100%,420px);background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid #292b50;border-radius:28px;padding:32px;box-shadow:0 32px 80px #0008}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--violet),var(--cyan));display:grid;place-items:center;color:#050617;font-size:24px}
    h1{font-size:30px;margin:38px 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 28px}.error{background:#511f36;color:#ffb8ca;padding:12px 14px;border-radius:12px;margin-bottom:18px}
    label{display:block;color:var(--muted);font-size:13px;margin:14px 0 7px}input{width:100%;height:52px;border-radius:14px;border:1px solid #343654;background:#090a20;color:var(--text);padding:0 15px;font:inherit;outline:none}input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #8b5cff22}
    .name{display:none}.actions{display:grid;gap:10px;margin-top:24px}button{height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--violet),#6640dd);color:white;font:600 16px system-ui;cursor:pointer}.secondary{background:transparent;border:1px solid #3b3d61;color:var(--muted)}small{display:block;text-align:center;color:#777b9f;margin-top:20px}
  </style>
</head>
<body><main>
  <div class="brand"><div class="mark">◉</div>ConditionWatch</div>
  <h1>Welcome back</h1><p>Sign in securely, then return to the app and tell it what to watch for.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/auth/mobile/submit" id="form">
    <div class="name" id="name"><label for="display_name">Your name</label><input id="display_name" name="display_name" autocomplete="name"></div>
    <label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required>
    <input type="hidden" name="action" id="action" value="login">
    <div class="actions"><button type="submit">Sign in and return to app</button><button type="button" class="secondary" id="register">Create an account</button></div>
  </form><small>Your camera frames are evaluated only for your active condition.</small>
</main><script>
  document.querySelector('#register').onclick=()=>{document.querySelector('#action').value='register';document.querySelector('#name').style.display='block';document.querySelector('#display_name').required=true;document.querySelector('h1').textContent='Create your account';document.querySelector('button[type=submit]').textContent='Create account and return';};
</script></body></html>
