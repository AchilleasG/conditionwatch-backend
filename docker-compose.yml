services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conditionwatch
      POSTGRES_USER: conditionwatch
      POSTGRES_PASSWORD: conditionwatch
    volumes: [conditionwatch-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conditionwatch"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://conditionwatch:conditionwatch@db:5432/conditionwatch
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets/conditionwatch-firebase-adminsdk-fbsvc-a1e6e0e356.json:/run/secrets/firebase-service-account.json:ro
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  conditionwatch-db:
